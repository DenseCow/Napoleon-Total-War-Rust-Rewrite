# The default translation of a .rigid_model material (buildings, ships, props, campaign map
# pieces) into the renderer's inputs. A mod replaces it by shipping
# materials/vanilla/rigid_model.toml, or covers some models only with a description of its own
# whose [applies] names a path prefix.
#
# Texture slots of a rigid model (the four textures of its material record, CONFIRMED
# 0x012234A0): diffuse, normal, gloss, dirt. "dirt" is the fourth texture, INFERRED to be the
# `_dirty_map`; nothing here uses it until the original's shader is read.
#
# The channel meanings below are INFERRED and the numbers PROVISIONAL until the original's
# shaders are read (BACKLOG §2, "The original's materials read in full"); each is marked.

[applies]
source = "rigid_model"

[alpha]
# CONFIRMED (0x011D9D80): _alphatest, _alphablend and _twosided in the model's path decide.
source_flags = true
cutoff = 0.5              # PROVISIONAL: the original's alpha-test reference is not traced

[base_colour]
texture = "diffuse"

[opacity]
texture = "diffuse.a"

[normal]
texture = "normal"
encoding = "rgb"          # PROVISIONAL: the channel layout is UNKNOWN (GRAPHICS_EXE.md §5)
flip_green = false        # PROVISIONAL: the green axis's direction is UNKNOWN (same section)

[roughness]
value = 0.8               # PROVISIONAL: hand-picked, for a model without a gloss map
texture = "gloss.a"       # INFERRED: the gloss map's alpha scales the specular exponent
convert = "specular_power"
power = 32.0              # PROVISIONAL: for a material without a `specpower` constant

[specular_tint]
texture = "gloss"         # INFERRED: the gloss map's colour is the specular colour

[specular_level]
value = 0.5               # PROVISIONAL: the common 4% reflectance

[baked]
base_colour_gain = 1.0    # PROVISIONAL: no compensation until the look is compared side by side
occlusion = 0.0           # PROVISIONAL: likewise

# The material record's own named constants (the names the exe looks for are CONFIRMED,
# analysis/worker1/GRAPHICS_EXE.md §2.2). The other names (specfresnelpower, fresnelpower,
# reflect_factor, ambient_factor, rimoffset, rimpower, specbrightness, glossfactor) have no
# input here yet: what each one does in the original's shader is not traced. The vec4 constants
# (rimcolor, specfactor) cannot be bound: [constants] takes float constants only.
[constants]
specpower = "roughness.power"   # INFERRED: the Blinn-Phong exponent
bumpfactor = "normal.scale"     # INFERRED: the strength of the normal map
