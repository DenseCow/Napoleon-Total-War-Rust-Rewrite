# Builds and tests every pull request and push to main on Windows (the only platform).
# Tests that need the game install skip themselves here. Runs with a read-only token and no secrets;
# pull requests never save the cache, so a fork can't poison it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests
        run: cargo test --workspace
      # Not blocking until the existing warnings are cleared (BACKLOG §12); no new ones in a PR.
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets
